[ttc-ground-below]
floor_1=As you dig deeper, the ground turns into loose rock.
floor_2=Below here the ground is solid stone. The next shaft will be a long one.
floor_3=The stone grows denser the deeper it goes, veined with something yellow.
floor_4=The rock below is warm to the touch, and getting warmer.
floor_5=The drill hums against rock that has never been dug. Nothing is known about what lies deeper.

