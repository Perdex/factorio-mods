ttc-reach-floor-2=Dig a core drill shaft down to floor 2.
ttc-reach-floor-3=Dig a core drill shaft down to floor 3.
ttc-reach-floor-4=Dig a core drill shaft down to floor 4.
ttc-reach-floor-5=Dig a core drill shaft down to floor 5.
ttc-iron-discovery=Dig up iron ore with a tunnel bore.

[ttc]
starter-instructions=No ore anywhere on this world. Yet the ground hums, from somewhere far below, and the core drill survived the crash. Luckily the soil here is soft and rich in clay.
shaft-reached=The core drill broke through to __1__.
dig-recipe-name=Dig with __1__
dig-recipe-description=The head lasts __1__ hits. The floor's rock, or vein, decides how tough it is to dig through and what it drops.
bore-needs-drill-head=The tunnel bore only takes drill heads.
core-drill-needs-drill-head=The core drill only takes drill heads.
drill-head-description=Drill head for tunnel bores and core drills. Lasts __1__ hits. Drilling speed: __2__.
shaft-recipe-name=Dig the shaft with __1__
shaft-depth-title=Shaft
shaft-depth=To __3__: __1__/__2__ hits
bore-wall-title=Wall ahead
bore-wall=Rock: __1__/__2__ hits
bore-wall-vein=__3__: __1__/__2__ hits
bore-circuit-title=Circuit network
bore-read-hits=Read hits remaining
bore-read-moved=Pulse when it moves
bore-turn-hint=On each step it turns by [virtual-signal=signal-clockwise-circle-arrow] or [virtual-signal=signal-anticlockwise-circle-arrow], whichever is larger. Contents, ingredients and fuel are read from the circuit settings.
transfer-no-floor-below=There is no floor below here yet.
transfer-blocked-below=The floor below must be open and free here.
needs-open-sky=A winnower needs open sky: build it on the surface.
manhole-not-dug=The floor below must be dug out under the whole hole.
manhole-realized=You suddenly realize you can just jump down if you make a hole big enough.
transfer-bottom-alone=This end is made by placing its other end on the floor above.

