[item-description]
ttc-manhole=A hole big enough to jump into: step in and you land on the floor below. Place it over ground that is dug out down there. Holes over holes take you down several floors at once.
ttc-underground-belt-down=Takes the belt down to the floor below: its outlet appears directly underneath, facing the same way. Items keep their lane.
ttc-underground-belt-up=Brings a belt up from the floor below: its inlet appears directly underneath, facing the same way. Items keep their lane.
ttc-fast-underground-belt-down=Takes the belt down to the floor below: its outlet appears directly underneath, facing the same way. Items keep their lane.
ttc-fast-underground-belt-up=Brings a belt up from the floor below: its inlet appears directly underneath, facing the same way. Items keep their lane.
ttc-express-underground-belt-down=Takes the belt down to the floor below: its outlet appears directly underneath, facing the same way. Items keep their lane.
ttc-express-underground-belt-up=Brings a belt up from the floor below: its inlet appears directly underneath, facing the same way. Items keep their lane.
ttc-turbo-underground-belt-down=Takes the belt down to the floor below: its outlet appears directly underneath, facing the same way. Items keep their lane.
ttc-turbo-underground-belt-up=Brings a belt up from the floor below: its inlet appears directly underneath, facing the same way. Items keep their lane.
ttc-pipe-down=Drains fluid to the floor below: its outlet appears directly underneath. Fluid only goes down.
ttc-pipe-up=Pumps fluid up from the floor below: its inlet appears directly underneath. Fluid only goes up.
ttc-mk1-bore=Digs a 2-wide tunnel through the rock, one tile at a time. Place it anywhere on open ground, facing the rock to dig, and give it drill heads and fuel; the heads wear out as it digs. Whatever it breaks loose collects in its output.
ttc-mk2-bore=Digs a 2-wide tunnel twice as fast as the Mk1. Feed drill heads, fuel and transport belts on the left lane behind it (seen facing the way it digs); it lays the belts behind it as it advances, and sends what it digs back along the right lane.
ttc-mk3-bore=Digs a 3-wide tunnel five times as fast as the Mk1. Like the Mk2 it lays belt lanes, and it also needs water piped into the middle of its back: feed pipes on its supply lane and it extends the water line as it advances.
burner-inserter=Wound by springs and counterweights: needs no fuel or power.
ttc-grinder=Grinds things into pieces: stone to gravel, gravel to sand, sand to dust. Every 3 become 2, and every step takes three times longer.
ttc-winnower=Lets the wind carry dust away. Only works under open sky, on the surface; needs no fuel.
ttc-power-connector=Carries electricity to the floor below. Place it above open ground on the next floor; its outlet pole appears there and supplies the power drawn up here. Power only goes down.
ttc-unfired-clay-drill-head=Fire it in a furnace to make a clay drill head.

