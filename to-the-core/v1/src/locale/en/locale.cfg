[technology-description]
ttc-reach-floor-1=Reached by a core drill shaft: clay to shape drill heads from, sand for glass, and the tunnel bore to dig out room.
ttc-reach-floor-2=Reached by a core drill shaft: harder stone, with iron in it. Downpipes carry water down from the surface.
ttc-reach-floor-3=Reached by a core drill shaft: copper and coal.
ttc-iron-discovery=Iron found underground: iron drill heads and blades.
ttc-copper-discovery=Copper found underground: reinforced drill heads.

[ttc]
starter-instructions=There is no ore up here: everything comes from digging. Salvage the core drill from the crashed ship and blades from the wreckage, and gather wood and stone. Wooden drill heads take 2 wood, 1 stone and a blade. Feed the core drill fuel and wooden heads: it digs a shaft down to floor 1, bringing up sand and clay, then moves down with it. Follow it down the stairs along the pit's rim; walk back up the same stairs below to return. Floor 1 reveals the tunnel bore (wood, stone, clay, blades), clay drill heads (shape clay, then fire it in a furnace), glass (smelted from sand) and item chutes to drop things down from above. Place the bore at the edge of open ground facing the rock wall and supply it with fuel and drill heads. Iron waits on floor 2.
shaft-reached=The core drill broke through to __1__.
dig-recipe-name=Dig __1__ with __2__
dig-recipe-description=The head lasts __1__ hits; this rock takes __2__ hits per tile, so one head digs __3__ tiles. Drops are paid out when the head wears out.
drill-head-description=Tunnel bore drill head. Lasts __1__ hits, __2__ s per hit.
shaft-recipe-name=Shaft segment to __1__
transfer-no-floor-below=There is no floor below here yet.
transfer-blocked-below=The floor below must be open and free here.
transfer-outlet-alone=An outlet is made by placing its inlet on the floor above.

