ttc-reinforced-drill-head=Reinforced drill heads

[technology-description]
ttc-manhole=Why take the stairs? Make a hole big enough to jump through.
ttc-reach-floor-1=Reached by a core drill shaft: clay to shape drill heads from, sand for glass, and the tunnel bore to dig out room.
ttc-reach-floor-2=Reached by a core drill shaft: harder stone, with a little iron in it. Grinders and winnowers finally deal with the rock.
ttc-reach-floor-3=Reached by a core drill shaft: copper and coal. Belts and pipes can now come back up from below.
ttc-reach-floor-4=Reached by a core drill shaft: sulfur and oil, and steel at last. Power connectors carry electricity down. Down here it's time to start thinking about defending yourself.
ttc-reach-floor-5=Reached by a core drill shaft: hot rock, only coolant-cooled bores work here. Carbide drill heads cut the hardest rock.
ttc-iron-discovery=Iron found underground: iron drill heads and the Tunnel bore Mk2, which lays its own belt lanes.
ttc-reinforced-drill-head=Steel and copper make drill heads that last 500 hits.

[ttc-trigger]
