[item-description]
ttc-blade=A cutting blade. Salvage them from the crash site; later they can be made from iron.
ttc-item-chute=Drops items to the floor below. Place it above open ground on the next floor; its outlet appears there. Items only go down.
ttc-downpipe=Drains fluid to the floor below. Place it above open ground on the next floor; its outlet appears there. Fluid only goes down.
ttc-unfired-clay-drill-head=Fire it in a furnace to make a clay drill head.

